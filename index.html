<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f8">
  <meta name="description" content="Simulador gratuito de exámenes tipo test para la licencia de armas E, basado en cuestionarios de la Guardia Civil.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest">

      <div class="brand">Licencia E</div>
